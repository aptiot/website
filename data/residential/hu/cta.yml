  title: "Ötlettől a Telepítésig"
  content: "Csapatunk segít ügyfeleinek megtervezni és megvalósítani elképzeléseit. A munkavégzésünk mindig alapos helyszíni felméréssel, radaros falszkenneléssel, vezetéknélküli interferencia méréssel indul. Törekszünk az igényes kivitelezésre precíziós lézeres eszközparkunk felhasználásával. Munkavégzésünk erősáramú kötéseit hőkamerás vizsgálattal ellenőrizzük, a kivitelezés biztonságosságát érintésvédelmi eszközökkel ellenőrizzük. Igény szerint rajzolvasás alapú árajánlat elkészítését, szabványos villamosipari rajz elkészítését és az alapján történő kivitelezést is vállalunk. Erősáramú, gyengeáramú, illetve vezetéknélküli informatikai hálózat kiépítésével is keressen bennünket bizalommal!"
