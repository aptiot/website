  title: "Ötlettől a Telepítésig"
  content:
    consult: Egyeztetünk időpontot egy ingyenes beszélgetéshez, amelynél 30 percben megértjük okosotthon céljait, vágyait.
    offer: Írásos árajánlatot küldünk emailben a kivitelezési költségekről, feltételekről, vállalási határidőkről. Reméljük, hogy szimpatikusnak fogja találni az ajánlatunkat.
    construct: Ha ajánlatunk elnyerte tetszését, a kivitelezéshez egyeztetünk időpontot. A telepítés után megtanítjuk a rendszer használatára, átadjuk az elkészült rendszer hozzáférési adatait, és segítünk az illetéktelenektől (magunktól is) elzárni privát okosotthonát.
    support: Kérdés és probléma esetén továbbra is állunk rendelkezésére a garanciális időszakban, és azután is.
