about:
  enable: true
  title: Tudd Rólunk
  about_item:
    - icon: ti-signal
      title: Letisztult
      content: Vezetéknélküli technológiáink használatával elkerülhetőek a munkálatok helyreállítási kellemetlenségei.
    - icon: ti-ruler-pencil
      title: Precíz
      content: Felmérési munkánkat lézeres távolságmérővel, falradarral és keresztlézerrel kivitelezzük.
    - icon: ti-brush
      title: Koszmentes
      content: Fúrásnál és horonymarásnál ipari porelszívó technológiát alkalmazunk, a kivitelezés alapvető takarítással zárul.