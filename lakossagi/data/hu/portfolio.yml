  title: Harmonikus Okosotthon
  portfolio_item :
    - name: Fűtésrendszer szabályozás
      image: images/portfolio/heating.png
      image_webp: images/portfolio/heating.webp
      categories:
        - Költséget szeretnék csökkenteni
        - Nagyobb kényelmet szeretnék
      content: A légkondiját, padlófűtését, radiátorát és törölközőszárítóját okosotthona egy összetett rendszerben fogja kezelni. Költséghatékonyság helyett tudunk optimális komfortra törekedni azoknál a szobáknál, amelyekben aktuálisan tartózkodik valaki. Célunk a maximális komfort biztosítása, a lehető legalacsonyabb üzemeltetési költségek mellett.
    - name: Hűtésrendszer szabályozás
      image: images/portfolio/cooling.png
      image_webp: images/portfolio/cooling.webp
      categories:
        - Költséget szeretnék csökkenteni
        - Nagyobb kényelmet szeretnék
        - Pára problémám van
      content: A légkondiját és mennyezethűtését okosotthona egy összetett rendszerben fogja kezelni. Költséghatékonyság helyett tudunk optimális komfortra törekedni azoknál a szobáknál, amelyekben aktuálisan tartózkodik valaki. Célunk a maximális komfort biztosítása, a lehető legalacsonyabb üzemeltetési költségek mellett.
    - name: Szellőztetés
      image: images/portfolio/ventillation.jpg
      image_webp: images/portfolio/ventillation.webp
      categories:
        - Költséget szeretnék csökkenteni
        - Nagyobb kényelmet szeretnék
        - Pára problémám van
        - Rossz a levegőm
      content: Okosotthona a mért légminőségnek megfelelően fogja szabályozni hővisszanyerős szellőztetőrendszerét. Célunk a penészedés elkerülése, és a jó légminőség biztosítása (CO2, VOC, radon), az ehhez szükséges lehető legalacsonyabb szellőztetési sebesség mellett.
    - name: Energiatárolás
      image: images/portfolio/energy.jpg
      image_webp: images/portfolio/energy.webp
      categories:
        - Költséget szeretnék csökkenteni
      content: Napelemeivel megtermelt villamosenergiáját okosotthonunk optimálisan fogja tárolni, napi rutinjához igazodva. Célunk a megtermelt villamosenergia valós időben elhasználása, az ingatlan elosztóhálózati függésének és áramszámlájának csökkentése.
    - name: Világítás
      image: images/portfolio/lighting.jpg
      image_webp: images/portfolio/lighting.webp
      categories:
        - Nagyobb kényelmet szeretnék
        - Költséget szeretnék csökkenteni
      content: "Mozgás-, jelenlét-, és geolokáció alapján ingatlanja automatikusan igazodni fog a szokásaihoz. Nappali tevékenységei során semleges fényszín, esti órákban melegfényű megvilágítás növeli komfortját. A jól bevált kapcsolókat továbbra is tudja használni az okosotthon vezérlőpulttal párhuzamosan."