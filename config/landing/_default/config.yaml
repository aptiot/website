baseURL: https://www.aptiot.hu
title: Aptiot
theme:
  - meghna-hugo
timeZone: Europe/Budapest
pagination:
  pagerSize: 6
summaryLength: 15
hasCJKLanguage: false
outputs:
  home:
    - HTML
imaging:
  quality: 90
  resampleFilter: lanczos
caches:
  images:
    dir: :resourceDir/_gen
    maxAge: 720h
  assets:
    dir: :resourceDir/_gen
    maxAge: 720h
markup:
  goldmark:
    renderer:
      unsafe: true
defaultContentLanguage: hu
module:
  mounts:
  - source: static/landing
    target: static
  - source: data/landing
    target: data
